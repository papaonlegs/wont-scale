# OPTIONAL template: won't-scale gatekeeper on every pull request.
#
# This is not run in this repo's own CI. Copy it into YOUR app repo as
# .github/workflows/wont-scale-audit.yml, then:
#   1. Add ANTHROPIC_API_KEY to that repo's Actions secrets.
#   2. That's it — wont-scale is a public repo, so no token is needed to
#      fetch the kit. The checkout step below pulls it straight from
#      papaonlegs/wont-scale. If you'd rather not add a second checkout,
#      pin a release and fetch it the way the installer does:
#      curl -fsSL https://github.com/papaonlegs/wont-scale/releases/latest/download/install.sh | sh
#      or vendor the kit into your repo instead.
#
# The job reviews only the PR diff against the ten failure modes and comments
# the gatekeeper verdict. It does not block merges unless you make the job
# required in branch protection.

name: wont-scale audit

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the audit kit (public repo, no token needed)
        uses: actions/checkout@v4
        with:
          repository: papaonlegs/wont-scale
          path: .wont-scale-kit

      - name: Run the gatekeeper
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--plugin-dir .wont-scale-kit"
          prompt: |
            Act as the scale-gatekeeper agent defined in
            .wont-scale-kit/agents/scale-gatekeeper.md. Review the diff between
            origin/${{ github.base_ref }} and HEAD against the ten wont-scale
            failure modes, using the modules in
            .wont-scale-kit/skills/scale-audit/references/ as the standard.
            Post your verdict (PASS / WARN / BLOCK with evidence) as a PR comment.
